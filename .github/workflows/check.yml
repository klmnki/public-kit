name: Check contributions
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 evals/2026-10-11/validate-fixtures.py
      - run: npm run build
      - run: python3 scripts/audit-release.py
